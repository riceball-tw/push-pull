<!DOCTYPE html>
<html lang="en" data-webtui-theme="catppuccin">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Pull - WebAssembly</title>

    <!-- Go WASM execution -->
    <script src="wasm_exec.js"></script>

    <!-- WebTUI – provides CSS variables and box layout -->
    <style>
        @import 'https://cdn.jsdelivr.net/npm/@webtui/css@0.0.3/dist/full.css';
        @import 'https://cdn.jsdelivr.net/npm/@webtui/theme-catppuccin/dist/index.css';
    </style>

    <style>
        /* ── layout ────────────────────────────────── */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: var(--background0);
            color: var(--foreground0);
            overflow: hidden;
        }

        /* outer page wrapper – gives us a centred column */
        #app {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 80vw;
            max-width: 900px;
            height: 100vh;
        }

        /* ── header bar (above the box) ────────────── */
        #page-header {
            flex-wrap: wrap;
            width: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2ch;
            box-sizing: border-box;
            transform: translateY(10%);
            z-index: 2;
        }

        #page-header h1 {
            font-size: 0.85rem;
            margin: 0;
            padding: 0 1ch;
            letter-spacing: 0.05em;
        }

        #page-header h1[is-="badge"] {
            line-height: 1.4;
            --badge-color: var(--background0);
            --badge-text: var(--foreground0);
            box-shadow: 0 0 0 2px var(--background0);
        }

        .github-link {
            display: flex;
            align-items: center;
            gap: 0.4ch;
            text-decoration: none;
            padding: 0 1.5ch;
            background: var(--background0);
            font-size: 0.8rem;
            color: var(--foreground2);
            box-shadow: 0 0 0 2px var(--background0);
            border-radius: 4px;
        }

        .github-link:hover {
            color: var(--foreground0);
        }

        .github-icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ── ASCII box wrapping the terminal ───────── */
        #terminal-box {
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        /* ── wterm container ──────────────────────────── */
        #terminal-container {
            flex: 1 1 auto;
            height: 65vh;
            min-height: 400px;
            padding: 0.5rem;
            box-sizing: border-box;
            display: flex;
        }

        #terminal-container .wterm {
            flex: 1;
        }

        /* ── wterm Catppuccin theme ───────────────────── */
        /* Maps webtui Catppuccin CSS vars to wterm's --term-* custom props */
        #terminal-container .wterm {
            --term-bg: var(--background0, #1e1e2e);
            --term-fg: var(--foreground0, #cdd6f4);
            --term-cursor: var(--foreground0, #cdd6f4);

            --term-color-0:  var(--background0, #1e1e2e);
            --term-color-1:  var(--red, #f38ba8);
            --term-color-2:  var(--green, #a6e3a1);
            --term-color-3:  var(--yellow, #f9e2af);
            --term-color-4:  var(--blue, #89b4fa);
            --term-color-5:  var(--mauve, #cba6f7);
            --term-color-6:  var(--teal, #94e2d5);
            --term-color-7:  var(--foreground0, #cdd6f4);
            --term-color-8:  var(--background2, #313244);
            --term-color-9:  var(--red, #f38ba8);
            --term-color-10: var(--green, #a6e3a1);
            --term-color-11: var(--yellow, #f9e2af);
            --term-color-12: var(--blue, #89b4fa);
            --term-color-13: var(--mauve, #cba6f7);
            --term-color-14: var(--teal, #94e2d5);
            --term-color-15: var(--foreground0, #cdd6f4);

            --term-font-family: '"JetBrains Mono", "Fira Code", "PingFang SC", "Microsoft YaHei", "Source Han Sans", monospace';
            --term-font-size: 16px;
            --term-line-height: 1.1;
        }

        /* ── responsive font size (replaces JS resize handler) ── */
        @media (max-width: 480px) {
            #terminal-container .wterm {
                --term-font-size: 12px;
            }
        }

        /* ── wterm base styles ──────────────────────────── */
        #terminal-container .wterm {
            position: relative;
            background: var(--term-bg);
            color: var(--term-fg);
            font-family: var(--term-font-family);
            font-size: var(--term-font-size);
            line-height: var(--term-line-height);
            padding: 12px;
            outline: none;
            overflow: hidden;
            border-radius: 0;
            box-shadow: none;
        }

        #terminal-container .wterm:focus,
        #terminal-container .wterm:focus-visible {
            outline: none;
        }

        .term-grid {
            display: block;
            white-space: pre;
            contain: layout paint style;
            will-change: contents;
        }

        .term-row {
            display: block;
            height: var(--term-row-height);
            line-height: var(--term-row-height);
            contain: layout style;
        }

        .term-row > span {
            display: inline-block;
            height: var(--term-row-height);
            vertical-align: top;
        }

        .term-block {
            width: 1ch;
            overflow: hidden;
        }

        .term-cursor {
            outline: 1px solid var(--term-cursor);
            outline-offset: -1px;
        }

        .wterm.focused .term-cursor {
            background: var(--term-cursor);
            color: var(--term-bg);
            outline: none;
        }

        .wterm.focused.cursor-blink .term-cursor {
            animation: cursor-blink 1s step-end infinite;
        }

        @keyframes cursor-blink {
            0%, 100% { background: var(--term-cursor); color: var(--term-bg); }
            50% { background: transparent; color: inherit; }
        }

        .wterm.has-scrollback {
            overflow-y: auto;
        }

        .wterm ::selection {
            background: var(--background2, rgba(86, 156, 214, 0.3));
        }

        /* ── wterm scrollbar ──────────────────────────── */
        .wterm.has-scrollback::-webkit-scrollbar       { width: 6px; }
        .wterm.has-scrollback::-webkit-scrollbar-track { background: transparent; }
        .wterm.has-scrollback::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.15);
            border-radius: 3px;
        }

        /* ── mobile controls ─────────────────────────── */
        #mobile-controls {
            display: none;
            padding: 0.75rem 0.5rem;
            border-top: 1px solid var(--background3);
        }

        .control-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        #mobile-controls [is-="button"] {
            justify-content: center;
            padding-block: 0.8rem;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            touch-action: manipulation;
        }

        .btn-undo  { 
            background: var(--yellow, #f9e2af);
            color: var(--background0);
        }
        .btn-pull  { 
            background: var(--background2, #313244);
            color: var(--green, #a6e3a1); 
        }
        .btn-pull.active {
            background: var(--green, #a6e3a1);
            color: var(--background0);
        }

        /* ── responsive ──────────────────────────────── */
        @media (max-width: 768px) {
            #app      { width: 95vw; }
            #terminal-container { height: 55vh; }
        }

        @media (max-width: 480px) {
            #app { width: 100vw; }
            #terminal-container { height: 50vh; min-height: 300px; }
            #mobile-controls { display: block; }
        }
    </style>
</head>
<body>
    <div id="app">

        <!-- ASCII box containing the terminal -->
        <div id="terminal-box" box-="square">
            <!-- Page header – sits above the ASCII box border -->
            <div id="page-header">
                <h1 is-="badge" cap-="slant-top slant-bottom">Push Pull — WASM</h1>
                <a href="https://github.com/riceball-tw/push-pull" target="_blank" class="github-link" title="View on GitHub">
                    <svg class="github-icon" viewBox="0 0 16 16">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    GitHub
                </a>
            </div>

            <div id="terminal-container"></div>
            <div id="mobile-controls">
                <div class="control-group">
                    <div is-="button" class="btn-undo" onclick="sendKey('u')">Undo</div>
                    <div is-="button" onclick="sendKey('k')">↑</div>
                    <div is-="button" class="btn-pull" id="pull-btn" onclick="togglePull()">Pull</div>
                    <div is-="button" onclick="sendKey('h')">←</div>
                    <div is-="button" onclick="sendKey('j')">↓</div>
                    <div is-="button" onclick="sendKey('l')">→</div>
                    <div style="visibility:hidden"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- wterm bundle – creates WTerm, exposes window.term with xterm-compat API -->
    <script src="wterm-bundle.js"></script>

    <script>
        (async function() {
            // Wait for wterm to finish initializing (Zig WASM binary loaded)
            await window._wtermReady;

            function togglePull() {
                const btn = document.getElementById('pull-btn');
                btn.classList.toggle('active');
            }

            function sendKey(key) {
                const pullActive = document.getElementById('pull-btn').classList.contains('active');
                let out = key;
                if (pullActive && ['h', 'j', 'k', 'l'].includes(key)) {
                    out = key.toUpperCase();
                }
                if (window._wasmOnData) {
                    window._wasmOnData(out);
                }
            }

            // Temporarily expose for inline onclick handlers
            window.togglePull = togglePull;
            window.sendKey = sendKey;

            // Load and run the WebAssembly module
            if (!WebAssembly.instantiateStreaming) {
                WebAssembly.instantiateStreaming = async (resp, importObject) => {
                    const source = await (await resp).arrayBuffer();
                    return await WebAssembly.instantiate(source, importObject);
                };
            }

            const go = new Go();
            WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then((result) => {
                window.term.write("\x1b[2J\x1b[H"); // Clear screen
                window.term.focus();
                go.run(result.instance);
            }).catch((err) => {
                console.error("Failed to load Wasm:", err);
                window.term.write("\r\n\x1b[31mFailed to load application.\x1b[0m\r\n");
            });
        })();
    </script>
</body>
</html>
